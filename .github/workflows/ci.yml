name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_pw
          MYSQL_DATABASE: enrollment_test
          MYSQL_USER: enroll
          MYSQL_PASSWORD: enroll_pw
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_pw"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://enroll:enroll_pw@127.0.0.1:3306/enrollment_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4        # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm contrast
